[package]
name = "isobmff-syntax"
version = "0.1.0"
edition = "2024"
description = "Support for ISO Base Media File Format and MP4 data"
repository = "https://github.com/dholroyd/isobmff-syntax.git"
license = "MIT OR Apache-2.0"

[dependencies]
byteorder = "1.5.0"
mp4ra-rust = "0.6.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "parse"
harness = false
